  zh: 2024 年全国大学生智能汽车竞赛模型组的团队开发归档，记录控制、感知和硬件分支的探索。
  en: A team development archive for the model group of the 2024 National College
    Student Intelligent Car Competition, documenting explorations in control,
    sensing, and hardware.
category:
  zh: 嵌入式控制 / 智能车
  en: Embedded Control / Smart Car
summary:
  zh: 面向 TC264/TC264D 的团队开发归档涉及嵌入式 C、DRV8701E
    电机驱动、PWM、编码器反馈、PID、舵机转向、相机图像实验、IMU、UART/显示及定制 PCB。记录仅描述开发分支。
  en: This team development archive for the TC264/TC264D covers embedded C, a
    DRV8701E motor driver, PWM, encoder feedback, PID, servo steering, camera
    and image experiments, IMU, UART/display, and a custom PCB. It describes
    development branches only.
