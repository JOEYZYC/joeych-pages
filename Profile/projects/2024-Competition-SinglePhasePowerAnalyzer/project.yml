title:
  zh: 单相功率分析仪
  en: Single-Phase Power Analyzer
claim:
  zh: 2024 年 TI 电子设计竞赛项目，面向单相交流负载进行电参量采集、频域分析与触控显示。
  en: A 2024 TI electronics design contest project for single-phase AC
    electrical-parameter acquisition, frequency-domain analysis, and
    touch-display presentation.
category:
  zh: 嵌入式测量 / 信号处理
  en: Embedded Measurement / Signal Processing
summary:
  zh: 基于 TI MSP432E401Y 的单相功率分析仪通过电压、电流互感器和 ADC 实时采样信号，并利用 FFT 开展频域分析。系统计算电压与电流有效值、视在功率、有功功率、功率因数、各次谐波及总谐波失真（THD），结果通过串口触控屏显示；设计与测试验证了其满足赛题要求的测量精度和电能质量监测能力。
  en: A single-phase power analyzer based on the TI MSP432E401Y samples voltage
    and current signals through transformers and ADC acquisition, then performs
    frequency-domain analysis with FFT. It calculates voltage and current RMS,
    apparent and active power, power factor, individual harmonics, and total
    harmonic distortion (THD), presenting results on a serial touchscreen.
    Design tests verified the measurement accuracy required by the contest task.
