  zh: 2023 年睿抗智能侦察竞赛的综合竞赛级记录，涵盖两个内部团队归档。
  en: A consolidated competition-level record for the 2023 RAICOM intelligent
    reconnaissance competition, covering two internal team archives.
category:
  zh: 机器人 / 智能侦察
  en: Robotics / Intelligent Reconnaissance
summary:
  zh: 项目完成四类智能侦察任务：使用灰度化、高斯滤波、Canny 边缘检测、轮廓提取和透视变换定位网格地雷；通过霍夫圆检测和标记物尺寸估算目标距离；使用 YOLOv5 完成兵人等目标识别；通过 ROS 节点、主题、消息和服务组织机器人感知与控制。图像处理程序支持批量读取、结果标注和输出保存。
  en: >-
    The project completed four intelligent-reconnaissance tasks: grid-mine
    localization using grayscale conversion, Gaussian filtering, Canny edges,
    contour extraction, and perspective transformation; target ranging from
    Hough-circle detection and known marker dimensions; object recognition with
    YOLOv5; and robot perception and control organized through ROS nodes, topics,
    messages, and services. The image-processing workflow supports batch input,
    annotated results, and saved outputs.
