id: 2024-Project-PerformanceStudyOfARigidLinearCircularDualPolarizationConversionMetasurface
year: 2024
featured: false
image: rigid-metasurface-sample.jpg
title:
  zh: 刚性线圆双极化转换超构表面性能研究
  en: Performance Study of a Rigid Linear-Circular Dual-Polarization Conversion
    Metasurface
claim:
  zh: 2024 年创新训练项目，研究刚性反射型超构表面的线偏振至圆偏振及交叉偏振转换。
  en: A 2024 innovation-training project studying linear-to-circular and
    cross-polarization conversion in a rigid reflective metasurface.
category:
  zh: 电磁超材料 / 仿真设计
  en: Electromagnetic Metamaterials / Simulation Design
summary:
  zh: 设计一种由金属双圆切角方形贴片谐振器、FR-4 介质基板和金属接地板组成的刚性反射型双极化转换超构表面。结构在 6.85–11.05 GHz 范围内的极化转换率超过 90%，相对带宽为 47.15%；在 5.83–6.68 GHz 和 11.54–16.93 GHz 范围内轴比低于 3 dB，相对带宽分别为 13.59% 和 37.86%。入射角不超过 50° 时，仍保持良好的线极化和圆极化转换性能。
  en: A rigid reflective dual-polarization conversion metasurface combines a
    metallic square-patch resonator with two circular corner cuts, an FR-4
    substrate, and a metal ground plane. Its polarization conversion ratio
    exceeds 90% from 6.85 to 11.05 GHz with a 47.15% relative bandwidth. The
    axial ratio remains below 3 dB across 5.83–6.68 GHz and 11.54–16.93 GHz,
    corresponding to relative bandwidths of 13.59% and 37.86%. Linear and circular
    polarization conversion remain effective for incidence angles up to 50°.
