summary:
  zh: 基于 Astro 构建，通过 Profile YAML
    统一管理个人资料、项目与成果，并生成中英双语静态页面。网站包含数据校验、基础路径感知链接、原生交互与 Playwright 端到端测试，通过
    GitHub Pages 自动部署。
  en: Built with Astro, the site uses Profile YAML as the single source for
    profile, project, and achievement data and generates bilingual static pages.
    It includes data validation, base-aware links, native interactions, and
    Playwright end-to-end tests, with automated deployment to GitHub Pages.
contribution:
  zh: 负责公开数据结构、Astro 页面实现、视觉设计系统、双语路由、交互与自动化测试维护。
  en: Designed the public data structure and maintained the Astro pages, visual
    system, bilingual routes, interactions, and automated tests.
