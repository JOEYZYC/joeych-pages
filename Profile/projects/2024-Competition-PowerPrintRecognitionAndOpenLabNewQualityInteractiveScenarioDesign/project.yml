id: 2024-Competition-PowerPrintRecognitionAndOpenLabNewQualityInteractiveScenarioDesign
year: 2024
featured: true
image: 拓扑图.png
title:
  zh: “电纹识别”与 OpenLab“新质”交互场景设计
  en: '"Power-Print Recognition" and OpenLab "New Quality" Interactive Scenario
    Design'
claim:
  zh: 在同一瑞萨赛事项目中，从用电电流识别发展至实验室能耗、安全、门禁与热监测的综合管理场景。
  en: A single Renesas competition project progressed from appliance-current
    recognition to an integrated laboratory scenario for energy use, safety,
    access, and thermal monitoring.
category:
  zh: 嵌入式系统 / 信号处理
  en: Embedded Systems / Signal Processing
summary:
  zh: 初赛“电纹识别”装置基于瑞萨 RA6M5 采集电流与电压波形，通过 ADC、DMA、FFT 和斯皮尔曼匹配识别设备状态与能耗模式。终赛 OpenLab“新质”管理系统将其扩展为多层级实验室监控平台，结合电力线载波通信、人脸门禁、热成像、W800 Wi-Fi、TCP 与 C# 上位机，统一管理设备运行、能耗、人员进出和过热风险。
  en: The preliminary "Power-Print Recognition" device used a Renesas RA6M5 to
    acquire current and voltage waveforms, applying ADC, DMA, FFT, and Spearman
    matching to identify equipment states and energy-use patterns. The final
    OpenLab "New Quality" management system expanded it into a multilevel
    laboratory-monitoring platform combining power-line communication, facial
    access control, thermal imaging, W800 Wi-Fi, TCP, and a C# host application
    for equipment, energy, access, and overheating supervision.
contribution:
