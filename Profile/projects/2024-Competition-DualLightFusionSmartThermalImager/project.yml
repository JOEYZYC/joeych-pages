id: 2024-Competition-DualLightFusionSmartThermalImager
year: 2024
featured: true
image: dual-light-fusion.png
title:
  zh: “双光融合”智能热像仪
  en: '"Dual-Light Fusion" Smart Thermal Imager'
claim:
  zh: 获全国大学生嵌入式芯片与系统设计竞赛东部赛区三等奖，并参加 2024 DigiKey 开源竞赛。
  en: Eastern Division Third Prize in the National Collegiate Embedded Chip and
    System Design Contest, and a 2024 DigiKey open-source contest entry.
category:
  zh: 计算机视觉 / 边缘 AI
  en: Computer Vision / Edge AI
summary:
  zh: 项目基于 STM32H7 与 OpenMV，融合 OV5640 可见光图像和 MLX90640 红外热成像数据，并使用 MicroPython 与 TensorFlow Lite 训练和优化轻量化手势识别模型，通过不同手势切换工作模式。LCD 触摸屏实时显示融合图像、区域温度和分析结果，可用于体温筛查和电路板焊接热分布检测。便携式硬件支持摄像头更换和自主充电。同一作品参加全国大学生嵌入式芯片与系统设计竞赛和 2024 DigiKey 开源竞赛。
  en: Built on STM32H7 and OpenMV, the device fuses OV5640 visible-light images
    with MLX90640 infrared thermal data. MicroPython and TensorFlow Lite support
    a lightweight gesture-recognition model that switches between operating
    modes. An LCD touchscreen presents fused imagery, regional temperatures,
    and analysis results in real time for uses including body-temperature
    screening and circuit-board soldering inspection. The portable hardware
    supports replaceable cameras and onboard charging. The same work entered
    both the National Collegiate Embedded Chip and System Design Contest and the
    2024 DigiKey open-source contest.
contribution:
  zh: 参与可见光与红外图像融合实现。
  en: Participated in implementing visible-light and infrared image fusion.
