summary:
  zh: 针对低信噪比、时变噪声环境下 ViT 调制识别鲁棒性下降的问题，ResGatNet 将大核 ResNet 主干、门控 CNN 和 Kolmogorov–Arnold Network（KAN）组合为混合网络。大核卷积扩展局部感受野，门控模块自适应抑制噪声，KAN 以较低参数复杂度增强全局表征。准静态与时变噪声实验表明，该模型在低信噪比条件下的分类准确率和泛化能力优于所比较的 CNN 与 ViT 基线。成果发表于 IEEE Access。
  en: ResGatNet addresses the loss of ViT modulation-recognition robustness under
    low-SNR, time-varying noise by combining a large-kernel ResNet backbone, a
    gated CNN, and a Kolmogorov–Arnold Network (KAN). Large kernels expand local
    receptive fields, the gated module adaptively suppresses noise, and KAN
    strengthens global representation with lower parameter complexity.
    Experiments under quasi-static and time-varying noise show higher
    classification accuracy and generalization than the evaluated CNN and ViT
    baselines. The work was published in IEEE Access.
