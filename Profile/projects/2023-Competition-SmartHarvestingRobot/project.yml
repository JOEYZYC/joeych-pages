title:
  zh: 基于 ROS 导航、果实识别与机械臂的农业采摘机器人
  en: Agricultural Harvesting Robot Based on ROS Navigation, Fruit Recognition, and a Robotic Arm
claim:
  zh: 2023 年 iCAN 未来农业机器人挑战赛项目，结合自主导航、果实视觉识别与机械臂执行。
  en: A 2023 iCAN Future Agriculture Robot Challenge project combining autonomous
    navigation, visual fruit recognition, and robotic-arm operation.
category:
  zh: 机器人 / 农业视觉
  en: Robotics / Agricultural Vision
summary:
  zh: 基于 ROS 的自主采摘机器人，采用 GMapping/SLAM 与导航进行环境移动，以 PaddleDetection 和 OpenCV
    进行果实视觉识别。机械臂配备眼在手上相机，并使用 3D 打印收集器完成采摘流程。
  en: A ROS-based autonomous harvesting robot using GMapping/SLAM and navigation
    for movement, with PaddleDetection and OpenCV for visual fruit recognition.
    Its robotic arm uses an eye-in-hand camera and a 3D-printed collector in the
    harvesting workflow.
