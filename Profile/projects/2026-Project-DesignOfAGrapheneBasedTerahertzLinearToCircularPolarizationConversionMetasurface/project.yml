id: 2026-Project-DesignOfAGrapheneBasedTerahertzLinearToCircularPolarizationConversionMetasurface
year: 2026
featured: true
image: modelpic.png
title:
  zh: 基于石墨烯的太赫兹线圆极化转换超表面设计
  en: Design of a Graphene-based Terahertz Linear-to-Circular
    Polarization-Conversion Metasurface
claim:
  zh: 优秀毕设 三等奖
  en: Outstanding Thesis, Third Prize
category:
  zh: 毕业设计
  en: Thesis
summary:
  zh: 设计一种基于石墨烯的太赫兹线圆极化转换超表面，在 2.774–4.840 THz 频段实现线线偏振转换，相对带宽为 54.27%；在 1.888–2.638 THz 和 5.073–5.938 THz 双频段实现线圆偏振转换，相对带宽分别为 33.14% 和 15.27%。通过调节石墨烯化学势，可动态控制偏振转换效率和轴比。研究结合理论分析、导纳模型和谐振频率处的表面电流分布解释转换机制，并分析结构参数与入射角影响；设计在宽入射角范围内保持宽带、高效率和良好角度稳定性。
  en: A graphene-based terahertz metasurface provides linear-to-linear
    polarization conversion from 2.774 to 4.840 THz with a 54.27% relative
    bandwidth, and linear-to-circular conversion across 1.888–2.638 THz and
    5.073–5.938 THz with relative bandwidths of 33.14% and 15.27%. Adjusting the
    graphene chemical potential dynamically controls conversion efficiency and
    axial ratio. Theoretical analysis, an admittance model, and resonant surface
    currents explain the mechanism, while structural-parameter and incidence-angle
    studies demonstrate broadband operation, high efficiency, and angular stability.
contribution:
  zh: 完成超表面结构设计、数值仿真、参数与入射角分析，并结合导纳模型和表面电流分布研究偏振转换机制。
  en: Completed the metasurface design and numerical simulations, analyzed
    structural parameters and incidence angles, and studied the conversion
    mechanism through an admittance model and surface-current distributions.
