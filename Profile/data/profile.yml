summary:
  zh: "苏州工学院电子信息工程专业本科生，综测专业排名 5\u2060/\u206071。研究兴趣涵盖嵌入式系统、无线感知与深度学习、超表面\u2060/\u2060太赫兹器件与天线设计。已发表学术论文 6\u00a0篇，申请发明专利 4\u00a0项，斩获国家级与省级学科竞赛奖项十余项。热爱动手实践，擅长从电路设计、嵌入式开发到算法部署的软硬件全栈工程。"
  en: Undergraduate in Electronic & Information Engineering at Suzhou Institute of Technology, ranked 5/71. Research interests span embedded systems, wireless perception with deep learning, and metasurface / terahertz devices and antenna design. Contributor to 6 publications and 4 patent applications, and recipient of 10+ national or provincial competition awards. A hands-on hardware-software engineer with experience spanning circuit design, embedded development, and algorithm deployment.
