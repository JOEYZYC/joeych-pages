  image: projects/power-print-recognition/power-print-architecture.jpg
  title: { zh: '“电纹识别”与 OpenLab“新质”交互场景设计', en: '"Power-Print Recognition" and OpenLab "New Quality" Interactive Scenario Design' }
  claim: { zh: '在同一瑞萨赛事项目中，从用电电流识别发展至实验室能耗、安全、门禁与热监测的综合管理场景。', en: 'A single Renesas competition project progressed from appliance-current recognition to an integrated laboratory scenario for energy use, safety, access, and thermal monitoring.' }
  category: { zh: '嵌入式系统 / 信号处理', en: 'Embedded Systems / Signal Processing' }
  summary:
    zh: 初赛项目“电纹识别”智能物联用电检测装置基于瑞萨 RA6M5 采集电器电流波形，并以 ADC、DMA、FFT 与斯皮尔曼匹配开展非侵入式设备识别。终赛项目 OpenLab“新质”交互场景设计将该子系统纳入实验室管理场景，结合 W800 Wi-Fi、TCP 与 C# 上位机进行状态查看和管理交互。
