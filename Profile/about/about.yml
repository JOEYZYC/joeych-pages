  title:
    zh: 自我介绍
    en: About
  summary:
    zh: 从个人背景、学习方向、教育经历与校园实践了解我的成长经历。
    en: Learn about my background, academic interests, education, and campus
      experience.
overview:
  - zh: 我叫张易成，来自江苏苏州，是一名电子信息工程本科毕业生，也是一名中共党员。我的学习和实践主要围绕嵌入式系统、无线感知、智能硬件、超表面与太赫兹展开。
    en: I'm Joey, from Suzhou, Jiangsu. I am an Electronic & Information Engineering
      graduate and a CPC member. My studies and practice focus on embedded
      systems, wireless sensing, intelligent hardware, metasurfaces, and
      terahertz technologies.
  - zh: 在校期间，我参与了电子设计、机器人、计算机视觉与科研论文等实践，也在航模社、融媒体中心、学生党支部和班级承担组织与协作工作。我希望继续把技术想法落实为可以运行、可以验证的软硬件作品。
    en: During university, I worked on electronic design, robotics, computer vision,
      and research publications, while taking organizational and collaborative
      responsibilities in the aeromodelling club, university media center,
      student Party branch, and class. I aim to keep turning technical ideas
      into hardware-software work that can run and be verified.
